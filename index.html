<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoshi Social Media</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1e28, #000);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            margin-top: 50px;
            width: 90%;
            max-width: 550px;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.4);
            margin-bottom: 15px;
        }
        h1 {
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 14px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: 0.25s;
        }
        .btn:hover {
            background: rgba(255,255,255,0.18);
        }
        .icon-img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <<img class="profile-pic" src="IMG_20251205_211739_217.webp" alt="Profile">

        <a class="btn" href="https://www.instagram.com/hoshihereed?igsh=MWtqZThnZTEwcG1rYQ==">
            <img class="icon-img" src="https://i.ibb.co/YTNjrtS/instagram.jpg" alt="ig"> Instagram
        </a>
        <a class="btn" href="https://www.tiktok.com/@hoshihere">
            <img class="icon-img" src="https://i.ibb.co/X7YZc2v/tiktok.jpg" alt="tt"> TikTok
        </a>
        <a class="btn" href="https://discord.com/users/hoshihereee">
            <img class="icon-img" src="https://i.ibb.co/mXJtMZc/discord.jpg" alt="dc"> Discord
        </a>
    </div>
</body>
</html>
